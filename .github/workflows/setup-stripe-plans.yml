name: Setup Stripe Plans

# Action manuelle uniquement — ne se déclenche jamais sur push/PR.
# Se connecte en SSH au serveur EC2 de prod (mêmes secrets que deploy.yml)
# et y lance scripts/setup-stripe-plans.mjs, qui recree/synchronise les
# produits & prix Stripe (weekly_pro, monthly_pro) et les tables
# SubscriptionPlan/PlanPrice en base.
#
# Tourne sur le serveur plutot que sur un runner GitHub car DATABASE_URL
# pointe vers un Postgres en localhost, accessible uniquement depuis le
# serveur lui-meme. STRIPE_SECRET_KEY et DATABASE_URL restent dans le
# .env du serveur, jamais dans les secrets GitHub.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tape exactement REACTIVATE pour confirmer (touche Stripe live + la base de prod)'
        required: true

jobs:
  setup-stripe-plans:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Vérifie la confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "REACTIVATE" ]; then
            echo "Confirmation invalide — le champ 'confirm' doit contenir exactement REACTIVATE."
            exit 1
          fi

      - name: Run setup-stripe-plans sur le serveur EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/zovo-builder-dashboard
            git pull origin main
            npm ci
            npx prisma generate
            node scripts/setup-stripe-plans.mjs
